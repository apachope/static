er-top:1px solid #d7dad7;margin-top:9px;padding-top:8px}.shipping-row>span{background:none;padding:0;font-size:12px;color:#68777a;line-height:1.3}.shipping-row b{font-size:20px;line-height:1.5;letter-spacing:.5px;overflow-wrap:anywhere}.pencils{position:absolute;right:15px;top:37px;font-size:24px;writing-mode:vertical-rl;opacity:.85}.task-scene:has(.photo-scene){overflow:visible}@media(max-height:760px) and (min-width:701px){.photo-wall{padding:10px 25px}.art-sky{height:42px}.art-land{font-size:24px;padding:0}.photo-desk{padding:12px 15px;gap:11px}.name-main{font-size:27px}.name-class{font-size:17px}.shipping-row b{font-size:18px}.shipping-label{padding:8px 10px}.parcel{padding:9px}}@media(max-width:700px){.task-scene>.photo-scene{max-height:none;overflow:visible}.photo-scene{max-width:430px;margin:auto}}

<script>
const $=x=>document.getElementById(x),COLORS=['#ff8c86','#78bcff'],ROWS=[0,4],GOAL_ROWS=[0,2,4],DIRS=[[-1,0],[0,1],[1,0],[0,-1]],SHAPES={straight:[1,3],bend:[0,1],tee:[0,1,3],cross:[0,1,2,3]},NAMES={straight:'直路',bend:'彎路',tee:'三岔路',cross:'十字路',block:'路障',clear:'清除工具'},KEY='network-treasure-two-teams-v1';const TASKS=[{"level": 1, "id": "a1", "title": "多我一個，真的沒差？", "kind": "單選", "story": "影片下方已經有幾百則留言嘲笑主角。小安想：「大家都在罵，多我一個也沒差，讓他難過的又不是只有我。」", "prompt": "這個想法忽略了什麼？", "options": ["每個加入的人，都可能讓嘲笑繼續擴大。", "超過一百則留言，再留言就不會增加影響。", "只有第一個罵的人需要負責。"], "answer": [0], "note": "人多不會讓自己的行為失去影響。", "scene": "comments"}, {"level": 1, "id": "a2", "title": "朋友傳的，就一定安全？", "kind": "聊天室單選", "story": "朋友的帳號突然傳來訊息：「幫我投票！我參加了繪畫比賽，快點這個連結，用社群帳號和密碼登入就可以投票，剩下五分鐘！」小安想：「是朋友傳的，應該不用擔心吧？」", "prompt": "哪個想法比較合理？", "options": ["朋友傳來的連結，一定安全。", "帳號可能被盜用，朋友也可能誤傳，應先透過其他方式確認。", "為了幫朋友，先登入再確認。"], "answer": [1], "note": "熟悉的帳號不代表訊息一定可靠；可透過原本已知的其他聯絡方式向朋友確認，不急著在不明網頁輸入帳號密碼。", "scene": "vote"}, {"level": 1, "id": "a3", "title": "只是開玩笑", "kind": "單選", "story": "有人把同學的照片做成梗圖。同學說不舒服，製作者回答：「我沒有惡意，只是想讓大家開心！」", "prompt": "哪個說法比較完整？", "options": ["有人覺得好笑，當事人就應該接受。", "沒有惡意，也可能造成傷害，需要在意對方感受。", "當事人不舒服，就證明製作者一定故意害他。"], "answer": [1], "note": "原本的用意和實際影響，可能不一樣。", "scene": "chat"}, {"level": 1, "id": "a4", "title": "AI畫的，就能隨便用？", "kind": "單選", "story": "小安用AI生成一張圖，想印在商品上販售。圖片卻和某位插畫家的作品非常相似。朋友說：「是AI畫的，又不是你抄的！」", "prompt": "哪個想法比較合理？", "options": ["經過AI就不用考慮著作權。", "不寫插畫家的名字就能使用。", "AI生成也不保證能任意使用，仍要確認來源與授權。"], "answer": [2], "note": "AI生成不是可以任意使用的保證。此題不要求孩子判定具體案件是否侵權。", "scene": ""}, {"level": 1, "id": "a5", "title": "找出危險習慣", "kind": "反向單選", "story": "小安為新社群帳號做了一份安全清單。", "prompt": "哪個做法會增加帳號與個資風險？", "options": ["不在公開介紹放電話和住址。", "不把驗證碼告訴別人。", "所有網站都用同一組密碼，方便記憶。", "對陌生連結先確認，不急著點開。"], "answer": [2], "note": "同一密碼若外洩，其他帳號也可能受到影響。", "scene": "password"}, {"level": 1, "id": "a6", "title": "匿名也能幫忙？", "kind": "情境單選", "story": "學校設置匿名求助箱。一位同學想反映自己被排擠，卻怕同學知道後更生氣。朋友說：「匿名都是拿來做壞事的，不要用！」", "prompt": "匿名求助箱可以有什麼正向用途？", "options": ["保護求助者的隱私，讓他能向可信任的老師說明困難。", "讓大家不用查證就公開指控別人。", "讓人偷偷留下辱罵訊息。"], "answer": [0], "note": "匿名不一定是逃避責任，也能用來保護求助者。向可信任的人如實說明困難，與公開散布指控不同。", "scene": "mask"}, {"level": 2, "id": "b1", "title": "公開就等於任意使用？", "kind": "單選", "story": "小晴公開分享自己的照片。有人下載後加上羞辱文字，再傳到其他群組，還說：「她自己公開的，拿來用有什麼不對？」", "prompt": "這句話混淆了哪兩件事？", "options": ["看得見照片，與可以任意拿來羞辱她。", "照片清楚，與照片模糊。", "認識她，與不認識她。"], "answer": [0], "note": "公開分享不代表同意被羞辱或任意改圖。", "scene": "post"}, {"level": 2, "id": "b2", "title": "一個笑臉的份量", "kind": "多選｜選兩個", "story": "小傑只在嘲笑同學的貼文下按「😂」，沒有打字。他說：「我只是表達心情，沒叫任何人繼續罵。」", "prompt": "他還需要考慮哪些影響？", "options": ["發文者可能覺得有人支持，繼續嘲笑。", "按表情就必須為整件事負全部責任。", "當事人可能覺得他也加入起鬨。", "沒有打字就不會影響別人。"], "answer": [0, 2], "note": "既不忽略自己的影響，也不把整件事的責任全歸給一人。", "scene": "comments"}, {"level": 2, "id": "b3", "title": "自由可以怎麼用？", "kind": "單選", "story": "經文說：「你們蒙召是要得自由……總要用愛心互相服事。」", "prompt": "哪個想法最符合？", "options": ["我能在網路上自由表達，也要考慮是否傷害別人。", "我有自由，所以什麼都可以說。", "我想看多久就看多久。"], "answer": [0], "note": "加拉太書5:13。自由包含選擇，也包含對別人的影響。", "scene": ""}, {"level": 2, "id": "b4", "title": "AI改幾個字就是原創？", "kind": "單選", "story": "小宇把別人的故事全文交給AI，只改角色名字和幾個詞，情節都保留，準備公開稱為自己的原創。", "prompt": "他的想法漏看了什麼？", "options": ["改得更好就能當自己的。", "改名換詞不代表成為自己的原創，也不代表取得原作使用權。", "只要AI改寫就不用確認來源。"], "answer": [1], "note": "尊重原作與授權；不把「經過AI」當作原創或合法使用的保證。", "scene": ""}, {"level": 2, "id": "b5", "title": "照片找線索", "kind": "圖片短答", "story": "這是小安準備放到公開社群的作品照，畫面內的資料都是虛構的。", "prompt": "請指出兩個需要先遮蔽的地方。", "options": [], "answer": null, "note": "包裹上的姓名／住址，以及姓名牌上的姓名與班級。指出兩處敏感資訊即可。", "scene": "photo"}, {"level": 2, "id": "b6", "title": "照片一樣，就是老師？", "kind": "情境單選", "story": "一個新帳號使用老師的姓名和照片，私訊小安：「我是老師，急著幫你處理帳號，快把密碼給我，不要到班群問。」小安想：「看起來是老師，就應該聽話。」", "prompt": "這個想法忽略了什麼？", "options": ["帳號名稱和照片可以被模仿，應透過原本認識的管道確認，也不提供密碼。", "對方說很急，就不需要查證。", "有老師的照片，就一定是老師本人。"], "answer": [0], "note": "尊重老師不代表相信所有自稱老師的帳號。確認身分時使用已知的聯絡管道。", "scene": ""}, {"level": 2, "id": "b7", "title": "通知一直叫我", "kind": "反向多選｜選兩個", "story": "你正在寫作業，平板接連跳出通知。原本只想看一眼，二十分鐘後卻仍停在同一題。", "prompt": "哪些想法不利於照自己的計畫使用網路？", "options": ["每次通知出現，都必須立刻查看。", "可以關掉非必要通知。", "下一支自動播放，就一定要看完。", "可以先設定結束時間再開始看。"], "answer": [0, 2], "note": "通知和自動播放不是命令；可以用環境設定幫自己做選擇。", "scene": "video"}, {"level": 3, "id": "c1", "title": "隱私和責任可以並存？", "kind": "多選｜選兩個", "story": "小安用暱稱保護自己。朋友卻說：「既然不公開真名，就不用對說過的話負責吧？」", "prompt": "哪些想法可以同時成立？", "options": ["可以用暱稱保護身分。", "用暱稱就能散布不實消息。", "不公開身分，仍要誠實和尊重別人。", "只有使用真名的人需要負責。"], "answer": [0, 2], "note": "「透明」指誠實負責，不是要求公開真實姓名或個資。", "scene": "mask"}, {"level": 3, "id": "c2", "title": "是他先開始的", "kind": "單選", "story": "隊友先嘲笑小宇，小宇很生氣，用更難聽的話回罵，並說：「是他先開始的，後面發生什麼都算他的！」", "prompt": "哪個判斷比較合理？", "options": ["不是先開始的人，就沒有責任。", "生氣可以理解，但自己的回應方式仍有責任。", "小宇只要感到生氣就是錯的。"], "answer": [1], "note": "區分情緒與行為；理解生氣不等於認同傷人。", "scene": "chat"}, {"level": 3, "id": "c3", "title": "刪掉了，還能做什麼？", "kind": "單選", "story": "甲說：「留言刪掉，事情就完全沒發生。」乙說：「已經有人截圖，任何補救都沒有用了。」", "prompt": "哪個想法比較完整？", "options": ["甲對，所有影響都會消失。", "乙對，留下足跡就無法改善。", "刪除能減少曝光，但仍要處理已造成的影響，補救仍有意義。"], "answer": [2], "note": "數位足跡可能保留，但仍能停止擴散、道歉和求助。", "scene": "trace"}, {"level": 3, "id": "c4", "title": "用了AI，就沒有自己的創作？", "kind": "單選", "story": "小晴自己設計故事和角色，用AI協助背景，之後又親自重畫和修改。同學說：「用過AI，整個作品就都不是你的創作！」", "prompt": "哪個判斷比較完整？", "options": ["用過AI就完全沒有自己的創作。", "輸入一句指令，全部內容就一定有自己的著作權。", "要看人實際投入哪些創意，不能只看有沒有用AI。"], "answer": [2], "note": "依台灣智慧財產局說明，須考量人類實際創意投入；不是以有無使用AI直接判定。", "scene": ""}, {"level": 3, "id": "c5", "title": "好心提醒，也可能傳錯？", "kind": "反向多選｜選兩個", "story": "小晴收到「明天全校停課」的截圖，沒看日期就轉到班群。後來發現是去年的公告。她說：「我也是好心提醒，又不是我做的圖，應該不關我的事。」", "prompt": "哪些想法不正確？", "options": ["消息不是我製作的，轉傳就不用考慮影響。", "好意不保證消息正確，轉傳前仍要查看來源和日期。", "只要出發點是好的，就不需要更正錯誤消息。", "發現傳錯後，可以更正並請大家停止轉傳。"], "answer": [0, 2], "note": "分辨用意與結果：想幫忙也可能傳錯。轉傳有自己的影響，發現錯誤仍能更正。", "scene": ""}, {"level": 3, "id": "c6", "title": "所有要求，都要照做？", "kind": "多選｜選兩個", "story": "小宇說：「要遵守規則，所以別人要求我做什麼，我都應該配合。」但有些要求保護人，有些要求卻會傷害人。", "prompt": "哪些要求屬於保護自己或他人的合理界線？", "options": ["家長和孩子共同約定，睡前把裝置放到固定位置。", "群組要求公開同學住址，才讓你繼續加入。", "平台要求不要散布別人的個資。", "隊友要求大家一起嘲笑輸掉比賽的人。"], "answer": [0, 2], "note": "區分保護人的界線與傷害人的同儕壓力。不是任何人的要求都值得配合。", "scene": ""}];let bank={},history=[],selected=-1,rotation=0,interval=null;
function tile(type,rot=0){return {type,rot,blocked:null}}
function fresh(){return {board:Array(35).fill(null),names:['紅隊','藍隊'],hands:Array.from({length:2},()=>[tile('straight'),tile('bend')]),claimed:Array.from({length:2},()=>[]),slot:0,phase:'task',used:0,level:1,task:null,seen:{1:[],2:[],3:[]},log:[],done:false,seconds:1200}}
let s;try{let data=JSON.parse(localStorage.getItem(KEY));s=data?.s||fresh()}catch{s=fresh()}
s.board=s.board.map(c=>c&&c.type!=='block'&&c.blocked!==null?{type:'block',rot:0,blocked:null,owner:c.blocked}:c);
if(s.taskSetVersion!==2){s.seen={1:[],2:[],3:[]};s.taskSetVersion=2;if(s.phase==='answer'){s.phase='task';s.task=null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({s,bank}))}catch{}}function snap(){history.push(JSON.stringify(s));if(history.length>100)history.shift()}function team(){return s.slot}function special(i){return i%7===0||i%7===6}function start(t){return ROWS[t]*7}function goal(g){return GOAL_ROWS[g]*7+6}function ports(card){return SHAPES[card.type].map(d=>(d+card.rot)%4)}
function cellPorts(i){if(i%7===0)return ROWS.includes(Math.floor(i/7))?[1]:[];if(i%7===6)return GOAL_ROWS.includes(Math.floor(i/7))?[3]:[];let c=s.board[i];return c&&c.type!=='block'&&c.blocked===null?ports(c):[]}
function neighbor(i,d){let r=Math.floor(i/7)+DIRS[d][0],c=i%7+DIRS[d][1];return r<0||r>=5||c<0||c>=7?-1:r*7+c}
function reachable(t){let seen=new Set([start(t)]),q=[start(t)];while(q.length){let i=q.shift();for(let d of cellPorts(i)){let n=neighbor(i,d);if(n>=0&&!seen.has(n)&&cellPorts(n).includes((d+2)%4)){seen.add(n);q.push(n)}}}return seen}
function valid(i,c){if(s.done||s.phase!=='play'||s.used>=2)return false;if(c.type==='clear')return !special(i)&&!!s.board[i];return !special(i)&&!s.board[i];}
function collect(){for(let t=0;t<COLORS.length;t++){let reach=reachable(t);for(let g=0;g<3;g++)if(reach.has(goal(g))&&!s.claimed[t].includes(g)){s.claimed[t].push(g);s.log.push(s.names[t]+' 取得寶藏'+String.fromCharCode(65+g)+'！')}}}
function svg(c){if(c.type==='block')return '<svg viewBox="0 0 100 100"><text x="50" y="70" text-anchor="middle" font-size="65">⛔</text></svg>';if(c.type==='clear')return '<svg viewBox="0 0 100 100"><text x="50" y="70" text-anchor="middle" font-size="65">🔧</text></svg>';let lines=ports(c).map(d=>{let p=[[50,0],[100,50],[50,100],[0,50]][d];return '<path d="M50 50 L'+p[0]+' '+p[1]+'"/>'}).join('');return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#ceb58a" stroke-width="25" fill="none">'+lines+'</g><circle cx="50" cy="50" r="12.5" fill="#ceb58a"/></svg>'}
function selection(){let c=s.hands[team()][selected];return c?{...c,rot:rotation}:null}function message(m){}
function remainingTasks(level){return TASKS.filter(q=>q.level===level&&!s.seen[level].includes(q.id)).length}
function hasRemainingTasks(){return [1,2,3].some(level=>remainingTasks(level)>0)}
function updateDifficultyAvailability(){const titles={1:'★ 基礎',2:'★★ 進階',3:'★★★ 挑戰'};for(const option of $('difficulty').options){const level=+option.value,n=remainingTasks(level);option.disabled=n===0;option.textContent=titles[level]+(n?' · 剩'+n+'題':' · 已用完')}if(s.phase==='task'&&remainingTasks(s.level)===0){const next=[1,2,3].find(level=>remainingTasks(level)>0);if(next){s.level=next;$('difficulty').value=next;earnedOptions()}}}

function earnedOptions(){let level=+$('difficulty').value;$('earned').replaceChildren(...Array.from({length:level+1},(_,i)=>new Option(i+'個',i)));$('earned').value=level}
function render(){let t=team();$('scores').replaceChildren(...COLORS.map((color,i)=>{let d=document.createElement('div');d.className='team'+(!s.done&&t===i?' active':'');d.style.setProperty('--color',color);let input=document.createElement('input');input.value=s.names[i];input.setAttribute('aria-label','隊伍名稱');input.onchange=()=>{snap();s.names[i]=input.value.trim()||'隊伍'+(i+1);render()};let score=document.createElement('div');score.innerHTML='<strong>'+s.claimed[i].length+'</strong> / 3 <small>寶藏</small>';let detail=document.createElement('small');detail.textContent='已取得：'+(s.claimed[i].map(g=>String.fromCharCode(65+g)).join('、')||'尚無');d.append(input,score,detail);return d}));let sc=selection();$('board').replaceChildren(...s.board.map((c,i)=>{let b=document.createElement('button');b.className='cell'+(!c&&!special(i)?' empty':'');let r=Math.floor(i/7);if(special(i)){let k=(i%7===0?ROWS:GOAL_ROWS).indexOf(r);if(k>=0){let label=document.createElement('span');label.className='label';if(i%7===0){label.textContent=s.names[k]+'起點';label.style.color=COLORS[k]}else{label.innerHTML='◆<br>寶藏'+String.fromCharCode(65+k);label.style.color='#ffd57a'}b.append(label)}else b.style.background='#37634f'}else if(c){b.innerHTML=svg(c);if(c.type!=='block'&&c.blocked!==null){let badge=document.createElement('span');badge.className='badge';badge.textContent='⛔';badge.style.background=COLORS[c.blocked];b.append(badge)}}let coord=document.createElement('span');coord.className='cell-coord';coord.textContent=String.fromCharCode(64+i%7)+(r+1);if(!special(i))b.append(coord);let ok=sc&&valid(i,sc);if(ok)b.classList.add('valid');b.disabled=!ok;b.setAttribute('aria-label',String.fromCharCode(64+i%7)+(r+1)+(c?' '+NAMES[c.type]:' 空格'));b.onclick=()=>use(i);return b}));$('handTitle').textContent=s.names[t]+'的建造工具';$('hand').replaceChildren(...s.hands[t].map((c,i)=>{let b=document.createElement('button');b.className='card'+(selected===i?' selected':'');b.disabled=s.done||s.phase!=='play'||s.used>=2;let shown=selected===i?{...c,rot:rotation}:c;b.innerHTML=svg(shown)+'<span>'+NAMES[c.type]+'</span>';b.onclick=()=>{selected=i;rotation=c.rot;render();message(c.type==='clear'?'請選擇要清除的道路或路障，該格會恢復空白。':c.type==='block'?'請選擇空格放置路障，阻止在該格鋪路。':'已選擇 '+NAMES[c.type]+'，請點選亮框位置。')};return b}));if(!s.hands[t].length)$('hand').textContent='目前沒有工具';$('rotate').disabled=!sc||!SHAPES[sc.type]||s.done||s.phase!=='play';$('deselect').disabled=selected<0;$('turn').textContent=s.done?'遊戲結束':s.names[t]+'的回合';$('turn').style.color=COLORS[t];updateDifficultyAvailability();$('difficulty').value=s.level;$('difficulty').disabled=s.done||s.phase!=='task'||!hasRemainingTasks();$('drawTask').disabled=s.done||s.phase!=='task'||!hasRemainingTasks();$('reopenTask').hidden=!s.task?.id;$('award').disabled=s.done||s.phase!=='answer';$('earned').disabled=s.done||s.phase!=='answer';$('next').disabled=s.done||s.phase!=='play';$('finish').disabled=s.done;$('undo').disabled=!history.length;persist()}
function result(){let max=Math.max(...s.claimed.map(x=>x.length)),win=s.names.filter((_,i)=>s.claimed[i].length===max);return win.join('、')+(win.length>1?' 並列獲勝':' 獲勝')+'，取得 '+max+' 個寶藏。'}
function use(i){let c=selection();if(!c||!valid(i,c))return;snap();if(c.type==='block')s.board[i]={type:'block',rot:0,blocked:null,owner:team()};else if(c.type==='clear')s.board[i]=null;else s.board[i]={...c};s.hands[team()].splice(selected,1);s.used++;s.log.push(s.names[team()]+' 使用'+NAMES[c.type]+'（'+String.fromCharCode(64+i%7)+(Math.floor(i/7)+1)+'）');selected=-1;collect();render();message(s.used===2?'':'還能行動一次，也可以保留工具、結束回合。')}
function randomCard(){let pool=['straight','straight','straight','bend','bend','bend','tee','tee','tee','cross','cross','cross','block','clear'];return tile(pool[Math.floor(Math.random()*pool.length)])}
function endGame(){s.done=true;selected=-1;render();showRanking()}

function showRanking(){let ordered=s.names.map((name,i)=>({name,score:s.claimed[i].length,color:COLORS[i],treasures:s.claimed[i]})).sort((a,b)=>b.score-a.score);let previous=-1,rank=0;$('rankingList').replaceChildren(...ordered.map((entry,index)=>{if(entry.score!==previous)rank=index+1;previous=entry.score;let row=document.createElement('div');row.className='ranking-row'+(rank===1?' winner':'');let place=document.createElement('span');place.className='rank-number';place.textContent=rank===1?'🏆':'第 '+rank+' 名';let name=document.createElement('strong');name.textContent=entry.name;name.style.color=entry.color;let score=document.createElement('span');score.className='rank-score';score.textContent=entry.score+' / 3';let gems=document.createElement('div');gems.className='rank-gems';gems.textContent=[0,1,2].map(g=>(entry.treasures.includes(g)?'💎 ':'◇ ')+String.fromCharCode(65+g)).join('　');row.append(place,name,score,gems);return row}));$('rankingDialog').showModal()}
$('closeRanking').onclick=()=>$('rankingDialog').close();$('backBoard').onclick=()=>$('rankingDialog').close();
$('help').onclick=()=>{const descriptions={straight:'連接兩端',bend:'轉個方向',tee:'三向分岔',cross:'四向連通',block:'占空格，擋鋪路',clear:'移除道路或路障'};$('helpTools').replaceChildren(...['straight','bend','tee','cross','block','clear'].map(type=>{let d=document.createElement('div');d.className='help-tool';d.innerHTML='<div class="tool-picture">'+svg(tile(type))+'</div><b>'+NAMES[type]+'</b><small>'+descriptions[type]+'</small>';return d}));$('helpDialog').showModal()};$('closeHelp').onclick=()=>$('helpDialog').close();$('startPlaying').onclick=()=>$('helpDialog').close();
function sceneMarkup(scene){
if(scene==='vote')return `<div class="mock-social"><div class="mock-top">💬 朋友的私訊 <small>虛構情境</small></div><div class="chat-scene"><div>🎨 幫我投票！我參加繪畫比賽！</div><div>點連結，用社群帳號和密碼登入。<br>⏰ 剩下五分鐘！</div></div><div class="mock-input">熟悉的帳號，就能直接相信嗎？</div></div>`;

if(scene==='photo')return `<div class="photo-scene" role="img" aria-label="作品桌面插圖，包含畫作、姓名牌與包裹；所有資料皆為虛構"><div class="photo-caption">📷 小安的作品照 <span>虛構資料</span></div><div class="photo-wall"><div class="artwork"><div class="art-sky"><span class="art-sun">☀</span><span class="art-cloud">☁</span></div><div class="art-land">🌳　🏠　🌷</div></div></div><div class="photo-desk"><div class="nametag"><div class="name-header">向日葵國小</div><div class="name-main">林小安</div><div class="name-class">五年三班</div></div><div class="parcel"><div class="parcel-top">宅配包裹 <span>▥▥▥▥▥</span></div><div class="shipping-label"><div class="shipping-row"><span>收件人</span><b>林小安</b></div><div class="shipping-row"><span>地址</span><b>彩虹市星星路123號</b></div></div></div><div class="pencils" aria-hidden="true">🖍️　✏️</div></div></div>`;
if(scene==='comments')return `<div class="mock-social"><div class="mock-top">📱 留言現場 <small>虛構情境</small></div><div class="mock-comment"><span>👤</span><div>這也太笨了吧！<small>😂 128　留言 86</small></div></div><div class="mock-comment"><span>👤</span><div>大家都這樣說，我也＋1<small>😂 42</small></div></div><div class="mock-input">如果是你，會怎麼想？</div></div>`;
if(scene==='video')return `<div class="video-scene"><div class="video-screen">▶<small>下一支影片即將播放…</small></div><div class="notification">🔔 遊戲通知　99＋</div><div class="time-plan">原本計畫：10分鐘　｜　還想做的事：完成模型 🏠</div></div>`;
if(scene==='mask')return `<div class="mask-scene"><div>🎭<b>畫面上：暱稱「小星星」</b></div><span class="speech">沒有人知道我是誰……</span><div class="human-side">👤<b>螢幕另一端：一個真實的人</b></div></div>`;
if(scene==='password')return `<div class="password-scene"><div>🎮 遊戲網站 <span>••••••••</span></div><div>💬 社群網站 <span>••••••••</span></div><div>📧 電子信箱 <span>••••••••</span></div><b>同一把鑰匙，開所有的門？ 🔑</b></div>`;
if(scene==='post')return `<div class="mock-social"><div class="mock-top">小晴的公開貼文</div><div class="post-photo">🌻<span>分享我的生活</span></div><div class="mock-input">公開可見 ≠ 任意使用</div></div>`;
if(scene==='trace')return `<div class="trace-scene"><div>💬<b>留言已刪除</b></div><span>⋯</span><div>📸<b>截圖仍在</b></div><span>⋯</span><div>💛<b>還能補救嗎？</b></div></div>`;
if(scene==='chat')return `<div class="chat-scene"><div>👤「只是開玩笑，幹嘛認真？」</div><div>👤「可是我真的不舒服……」</div></div>`;return ''}
function openTask(q){$('taskTitle').textContent='★'.repeat(q.level)+'　'+q.title;$('answerPanel').hidden=!s.task?.revealed;$('revealAnswer').hidden=!!s.task?.revealed;const root=$('question');root.replaceChildren();let badge=document.createElement('div');badge.className='task-kind';badge.textContent=q.kind.includes('多選')?'✓ 多選':q.kind.includes('單選')?'● 單選': '🎤 簡答';badge.className+=' '+(q.kind.includes('多選')?'multi':'single');root.append(badge);if(q.scene){let scene=document.createElement('div');scene.className='task-scene';scene.innerHTML=sceneMarkup(q.scene);root.append(scene)}let story=document.createElement('p');story.className='task-story';story.textContent=q.story;root.append(story);let prompt=document.createElement('h3');prompt.className='task-prompt';prompt.textContent=q.prompt;root.append(prompt);if(q.options.length){let opts=document.createElement('div');opts.className='task-options';q.options.forEach((text,i)=>{let btn=document.createElement('button');btn.className='task-option';btn.dataset.optionIndex=i;btn.setAttribute('aria-pressed','false');let num=document.createElement('span');num.textContent=['①','②','③','④'][i];let copy=document.createElement('span');copy.textContent=text;btn.append(num,copy);if(s.task?.selected?.includes(i)){btn.classList.add('chosen');btn.setAttribute('aria-pressed','true')}btn.onclick=()=>{if(s.task?.revealed)return;if(!q.kind.includes('多選'))opts.querySelectorAll('button').forEach(b=>{b.classList.remove('chosen');b.setAttribute('aria-pressed','false')});btn.classList.toggle('chosen');btn.setAttribute('aria-pressed',btn.classList.contains('chosen')?'true':'false');s.task.selected=[...opts.querySelectorAll('button')].map((b,index)=>b.classList.contains('chosen')?index:-1).filter(index=>index>=0);persist()};opts.append(btn)});root.append(opts)}else{let short=document.createElement('div');short.className='short-answer';short.textContent='🎤 請隊伍口頭回答一句，或在視訊聊天室作答。';root.append(short)}$('taskAnswer').replaceChildren();let ans=document.createElement('strong');ans.textContent=q.answer?'參考答案：'+q.answer.map(i=>['①','②','③','④'][i]).join('、'):'參考回答／達成重點';let note=document.createElement('p');note.textContent=q.note;$('taskAnswer').append(ans,note);if(q.title.includes('AI')){let link=document.createElement('a');link.href='https://www.tipo.gov.tw/tw/copyright/692-34252.html';link.textContent='教師參考：智慧財產局 AI 與著作權說明';link.target='_blank';link.rel='noopener';$('taskAnswer').append(link)}if(s.task?.revealed)markTaskAnswers(q);$('taskDialog').showModal();beginTaskClock(q)}



function markTaskAnswers(q){if(!q||!q.answer)return;const buttons=[...$('question').querySelectorAll('.task-option')];let correct=true;buttons.forEach((btn,i)=>{const expected=q.answer.includes(i),chosen=btn.classList.contains('chosen');if(expected!==chosen)correct=false;btn.disabled=true;btn.classList.add(expected?'answer-correct':'answer-incorrect');if(!expected&&chosen)btn.classList.add('picked-wrong');const tag=document.createElement('span');tag.className='answer-tag';tag.textContent=expected?(chosen?'✓ 答對了':'✓ 正確答案（未選）'):(chosen?'✕ 選錯了':'✕ 非正確答案');btn.append(tag)});let result=document.createElement('div');result.className='task-result '+(correct?'result-correct':'result-retry');result.textContent=correct?'✓ 答對了！':buttons.some(b=>b.classList.contains('chosen'))?'再看一下：有選錯或漏選的選項。':'正確答案已標示，請一起看看原因。';$('taskAnswer').prepend(result)}

let taskClockInterval=null;
function stopTaskClock(){if(taskClockInterval!==null){clearInterval(taskClockInterval);taskClockInterval=null}if(s.task&&s.task.deadline){s.task.secondsLeft=Math.max(0,Math.ceil((s.task.deadline-Date.now())/1000));delete s.task.deadline;persist()}}
function paintTaskClock(){let secs=s.task?.secondsLeft||0;$('taskClock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');$('taskClock').classList.toggle('urgent',secs<=10);$('timeUp').textContent=secs===0?'時間到！可以繼續回答。':'';$('pauseTask').textContent=taskClockInterval===null?'繼續':'暫停';$('pauseTask').disabled=secs===0||!!s.task?.revealed}
function runTaskClock(){if(!s.task||s.task.secondsLeft<=0||s.task.revealed){paintTaskClock();return}s.task.deadline=Date.now()+s.task.secondsLeft*1000;taskClockInterval=setInterval(()=>{if(!s.task)return;s.task.secondsLeft=Math.max(0,Math.ceil((s.task.deadline-Date.now())/1000));if(s.task.secondsLeft===0)stopTaskClock();paintTaskClock()},200);paintTaskClock()}
function beginTaskClock(q){stopTaskClock();if(typeof s.task.secondsLeft!=='number')s.task.secondsLeft=({1:30,2:45,3:60})[q.level];runTaskClock()}
$('pauseTask').onclick=()=>{if(taskClockInterval!==null)stopTaskClock();else runTaskClock();paintTaskClock()};
$('resetTaskClock').onclick=()=>{stopTaskClock();s.task.secondsLeft=({1:30,2:45,3:60})[s.level];runTaskClock();paintTaskClock();persist()};
$('revealAnswer').onclick=()=>{stopTaskClock();s.task.revealed=true;markTaskAnswers(TASKS.find(q=>q.id===s.task.id));$('answerPanel').hidden=false;$('revealAnswer').hidden=true;paintTaskClock();persist()};
$('taskDialog').addEventListener('close',stopTaskClock);$('taskDialog').addEventListener('cancel',stopTaskClock);

$('difficulty').onchange=()=>{s.level=+$('difficulty').value;earnedOptions();persist()};$('drawTask').onclick=()=>{snap();s.level=+$('difficulty').value;let pool=TASKS.filter(q=>q.level===s.level),available=pool.filter(q=>!s.seen[s.level].includes(q.id));if(!available.length){render();return}let q=available[Math.floor(Math.random()*available.length)];s.seen[s.level].push(q.id);s.task={id:q.id};s.phase='answer';earnedOptions();openTask(q);render()};$('reopenTask').onclick=()=>{const q=TASKS.find(q=>q.id===s.task?.id);if(q)openTask(q)};$('closeTask').onclick=()=>{stopTaskClock();$('taskDialog').close()};$('award').onclick=()=>{if(s.phase!=='answer')return;snap();let n=Math.min(s.level,Math.max(0,+$('earned').value)),cards=Array.from({length:n},randomCard);s.hands[team()].push(...cards);s.phase='play';s.used=0;s.log.push(s.names[team()]+' 任務獲得 '+n+' 個工具');render();message(cards.length?'獲得：'+cards.map(c=>NAMES[c.type]).join('、'):'這次沒有新工具，仍可使用現有工具。')};$('rotate').onclick=()=>{rotation=(rotation+1)%4;render()};$('deselect').onclick=()=>{selected=-1;render();message('')};$('next').onclick=()=>{snap();s.slot=(s.slot+1)%COLORS.length;s.phase='task';s.task=null;s.used=0;selected=-1;s.level=1;earnedOptions();render();message('')};$('finish').onclick=()=>{snap();endGame()};$('undo').onclick=()=>{if(history.length){s=JSON.parse(history.pop());selected=-1;$('difficulty').value=s.level;earnedOptions();render();message('已復原上一步。')}};$('reset').onclick=()=>{if(confirm('清空本局並開始新遊戲？題庫與隊名會保留。')){snap();let names=s.names;s=fresh();s.names=names;selected=-1;earnedOptions();render();message('')}};
$('difficulty').value=s.level;earnedOptions();render();
</script></body></html>
